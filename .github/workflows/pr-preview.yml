
name: PR Preview Deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  deploy:
    name: Deploy PR Preview
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build application
        working-directory: source
        run: npm run build
        env:
          PUBLIC_URL: /webpack-templet/pr-preview/pr-${{ github.event.number }}/

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 0

      - name: Replace previous PR build
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          TARGET="publish/pr-preview/pr-${PR_NUMBER}"

          # Delete old hashed chunks for this PR only.
          rm -rf "$TARGET"

          mkdir -p "$TARGET"

          # Copy the latest build.
          cp -a source/dist/. "$TARGET/"

      - name: Commit and push preview
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No preview changes."
            exit 0
          fi

          git commit -m "Deploy PR #${{ github.event.number }}"

          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git rebase origin/gh-pages

            if git push origin HEAD:gh-pages; then
              echo "Preview deployed."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 3
          done

          echo "Preview deployment failed."
          exit 1

      - name: Add preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;

            const url =
              `https://${owner}.github.io/${repo}/pr-preview/pr-${number}/`;

            const marker = '<!-- pr-preview-comment -->';

            const body = `${marker}
            ## 🚀 PR Preview Deployed

            **Preview URL:** ${url}

            This preview updates automatically with new commits.`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: number
              });

            const existing = comments.find(c =>
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  cleanup:
    name: Remove PR Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 0

      - name: Delete PR preview
        working-directory: publish
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          TARGET="pr-preview/pr-${PR_NUMBER}"

          rm -rf "$TARGET"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Preview already removed."
            exit 0
          fi

          git commit -m "Remove PR #${PR_NUMBER} preview"

          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git rebase origin/gh-pages

            if git push origin HEAD:gh-pages; then
              echo "PR preview removed."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 3
          done

          echo "Cleanup failed."
          exit 1

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const marker = '<!-- pr-preview-comment -->';

            const { data: comments } =
              await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: number
              });

            const existing = comments.find(c =>
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${marker}
            ## 🗑️ PR Preview Removed

            This preview was removed because the PR was closed.`
              });
            }
