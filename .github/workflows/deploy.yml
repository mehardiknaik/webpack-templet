
name: Deploy Main to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build application
        working-directory: source
        run: npm run build
        env:
          PUBLIC_URL: /webpack-templet/

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 0

      - name: Replace main deployment files
        run: |
          cd publish

          # Remove previous main build.
          # Preserve all PR preview directories.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'pr-preview' \
            -exec rm -rf -- {} +

          # Copy new main build.
          cp -a ../source/dist/. .

      - name: Commit and push deployment
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi

          git commit -m "Deploy main"

          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git rebase origin/gh-pages

            if git push origin HEAD:gh-pages; then
              echo "Deployment successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 3
          done

          echo "Deployment failed after retries."
          exit 1
